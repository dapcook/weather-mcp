<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Console</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --border: #dfe3e8;
    --text: #1b1f24;
    --muted: #5d6673;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --accent-soft: #e6effd;
    --ok: #1a7f37;
    --ok-soft: #e3f4e8;
    --err: #c62828;
    --err-soft: #fdecec;
    --code-bg: #f3f4f6;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --panel: #171b21;
      --panel-2: #1e232b;
      --border: #2b323c;
      --text: #e6e9ee;
      --muted: #97a1ae;
      --accent: #4c8dff;
      --accent-text: #0b1220;
      --accent-soft: #1a2940;
      --ok: #4ec46a;
      --ok-soft: #16301f;
      --err: #ff6b6b;
      --err-soft: #3a1c1c;
      --code-bg: #1f252e;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  .status {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    padding: 3px 10px; border-radius: 999px; background: var(--panel-2);
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.ok .dot { background: var(--ok); }
  .status.err { color: var(--err); background: var(--err-soft); }
  .status.err .dot { background: var(--err); }

  /* ---------- layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr);
    gap: 20px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav { position: static !important; max-height: none !important; }
  }

  /* ---------- sidebar ---------- */
  nav {
    position: sticky; top: 72px;
    align-self: start;
    max-height: calc(100vh - 92px);
    overflow-y: auto;
  }
  nav input[type=search] {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    margin-bottom: 10px;
  }
  .group-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted);
    margin: 14px 8px 4px;
  }
  .tool-btn {
    display: block; width: 100%; text-align: left;
    border: 0; background: none; cursor: pointer;
    padding: 6px 10px; border-radius: 7px;
    color: var(--text);
  }
  .tool-btn:hover { background: var(--panel-2); }
  .tool-btn[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tool-btn .tool-id { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; }

  /* ---------- cards ---------- */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }
  .card + .card { margin-top: 16px; }
  .tool-head h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .tool-head code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .tool-desc { color: var(--muted); margin: 8px 0 0; }
  .tool-desc details summary { cursor: pointer; color: var(--accent); font-size: 13px; }

  /* ---------- location helper ---------- */
  .loc {
    margin-top: 16px;
    padding: 12px;
    background: var(--panel-2);
    border-radius: 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto;
    gap: 8px;
    align-items: end;
  }
  @media (max-width: 640px) { .loc { grid-template-columns: minmax(0, 1fr); } }
  .loc label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  .search-row { display: flex; gap: 6px; position: relative; }
  .search-row input { flex: 1; min-width: 0; }
  .results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 4;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.14);
    max-height: 260px; overflow-y: auto;
  }
  .results button {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    padding: 8px 10px; cursor: pointer;
  }
  .results button:hover, .results button:focus { background: var(--accent-soft); outline: none; }
  .results small { color: var(--muted); display: block; }
  .results .empty { padding: 8px 10px; color: var(--muted); }

  /* ---------- form ---------- */
  form.fields {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px 16px;
  }
  .field.wide { grid-column: 1 / -1; }
  .field label.name { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .field .req { color: var(--err); margin-left: 2px; }
  .field .help { color: var(--muted); font-size: 12px; margin-top: 4px; }
  input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--panel);
  }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  textarea { font-family: var(--mono); font-size: 12px; min-height: 70px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px;
    cursor: pointer; user-select: none; font-size: 13px;
  }
  .chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip input { margin: 0; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding-top: 4px; }
  .switch input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }

  .actions {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding-top: 4px;
  }
  .btn {
    border: 1px solid var(--border); background: var(--panel);
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; }

  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid currentColor; border-right-color: transparent;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

  /* ---------- result ---------- */
  .result-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding-bottom: 12px; margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .result-head .title { font-weight: 600; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
  .badge.err { background: var(--err-soft); color: var(--err); }
  .result-head .spacer { flex: 1; }
  .placeholder { color: var(--muted); text-align: center; padding: 30px 10px; }

  .md { overflow-wrap: anywhere; }
  .md h1 { font-size: 20px; margin: 16px 0 8px; }
  .md h2 { font-size: 17px; margin: 18px 0 6px; padding-top: 10px; border-top: 1px solid var(--border); }
  .md h2:first-child, .md h1 + h2 { border-top: 0; padding-top: 0; }
  .md h3 { font-size: 15px; margin: 14px 0 4px; }
  .md h4, .md h5, .md h6 { font-size: 14px; margin: 12px 0 4px; }
  .md p { margin: 6px 0; }
  .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
  .md code { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
  .md a { color: var(--accent); }
  .md img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); display: block; margin: 8px 0; }
  .md .table-wrap { overflow-x: auto; margin: 8px 0; }
  .md table { border-collapse: collapse; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .md th { background: var(--panel-2); }
  pre.raw {
    white-space: pre-wrap; font-family: var(--mono); font-size: 12px;
    background: var(--code-bg); padding: 12px; border-radius: 8px; margin: 12px 0 0;
    overflow-wrap: anywhere;
  }
  /* ---------- radar map ---------- */
  .radar-map {
    position: relative; overflow: hidden;
    height: 400px; margin: 8px 0;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel-2);
    touch-action: none; cursor: grab;
  }
  .radar-map.dragging { cursor: grabbing; }
  .radar-map .tiles { position: absolute; inset: 0; }
  .md .radar-map img, .radar-map img {
    position: absolute; width: 256px; height: 256px;
    max-width: none; margin: 0; border: 0; border-radius: 0;
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  /* Esri's gray canvas is very faint; boost it so state lines and coasts read */
  .radar-map img.base { filter: contrast(1.6); }
  .radar-map img.radar { opacity: .75; }
  .radar-map img.roads { opacity: .7; }
  .radar-map .pin {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border-radius: 50%; background: #e5484d; border: 3px solid #fff;
    box-shadow: 0 0 0 2px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.4);
    z-index: 2; pointer-events: none;
  }
  .radar-map .zoom {
    position: absolute; top: 10px; right: 10px; z-index: 3;
    display: flex; flex-direction: column;
    border-radius: 7px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .radar-map .zoom button {
    width: 32px; height: 32px; border: 0; cursor: pointer;
    background: var(--panel); color: var(--text); font-size: 18px; line-height: 1;
  }
  .radar-map .zoom button + button { border-top: 1px solid var(--border); }
  .radar-map .zoom button:disabled { opacity: .4; cursor: default; }
  .radar-map .map-label, .radar-map .attribution {
    position: absolute; z-index: 3;
    background: color-mix(in srgb, var(--panel) 85%, transparent);
    color: var(--text); font-size: 11px; padding: 2px 7px; border-radius: 5px;
  }
  .radar-map .map-label { top: 10px; left: 10px; font-weight: 600; }
  .radar-map .attribution { bottom: 6px; right: 6px; color: var(--muted); }
  .radar-map .attribution a { color: inherit; }
  .error-box { background: var(--err-soft); color: var(--err); padding: 10px 12px; border-radius: 8px; margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Weather Console</h1>
  <span class="sub">Run the Weather MCP tools directly, no LLM needed</span>
  <span class="status" id="status"><span class="dot"></span><span id="status-text">Connecting…</span></span>
</header>

<div class="layout">
  <nav aria-label="Tools">
    <input type="search" id="tool-filter" placeholder="Filter tools…" aria-label="Filter tools">
    <div id="tool-list"></div>
  </nav>

  <main>
    <section class="card" id="tool-card">
      <div class="placeholder">Loading tools…</div>
    </section>
    <section class="card" id="result-card" hidden>
      <div class="result-head">
        <span class="title" id="result-title"></span>
        <span class="badge" id="result-badge"></span>
        <span class="hint" id="result-meta"></span>
        <span class="spacer"></span>
        <button class="btn small" type="button" id="toggle-raw">Show markdown</button>
        <button class="btn small" type="button" id="copy-result">Copy</button>
      </div>
      <div id="result-body"></div>
    </section>
  </main>
</div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------
  // Presentation metadata (purely cosmetic; unknown tools still work)
  // ---------------------------------------------------------------------
  const GROUPS = [
    ['Forecasts', ['get_forecast', 'get_forecast_nomads', 'get_model_comparison_forecast', 'get_historical_weather']],
    ['Now & alerts', ['get_current_conditions', 'get_alerts', 'get_weather_imagery', 'get_lightning_activity']],
    ['Environment & hazards', ['get_air_quality', 'get_marine_conditions', 'get_river_conditions', 'get_wildfire_info']],
    ['Locations', ['search_location', 'save_location', 'list_saved_locations', 'get_saved_location', 'remove_saved_location']],
    ['System', ['check_service_status']],
  ];
  const TITLES = {
    get_forecast: 'Forecast',
    get_forecast_nomads: 'NOMADS GFS forecast',
    get_model_comparison_forecast: 'Model comparison',
    get_historical_weather: 'Historical weather',
    get_current_conditions: 'Current conditions',
    get_alerts: 'Weather alerts',
    get_weather_imagery: 'Radar imagery',
    get_lightning_activity: 'Lightning activity',
    get_air_quality: 'Air quality',
    get_marine_conditions: 'Marine conditions',
    get_river_conditions: 'River conditions',
    get_wildfire_info: 'Wildfires',
    search_location: 'Search location',
    save_location: 'Save location',
    list_saved_locations: 'Saved locations',
    get_saved_location: 'Saved location details',
    remove_saved_location: 'Remove saved location',
    check_service_status: 'Service status',
  };
  const SLOW_TOOLS = new Set(['get_forecast_nomads', 'get_model_comparison_forecast']);
  const LOCATION_STORE_TOOLS = new Set(['save_location', 'remove_saved_location']);

  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : String(value));
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  };

  const store = {
    get(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ } },
  };

  const humanize = (key) => key.replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase());
  const titleFor = (tool) => TITLES[tool.name] || humanize(tool.name.replace(/^get_/, ''));

  // ---------------------------------------------------------------------
  // API
  // ---------------------------------------------------------------------
  async function api(path, options = {}) {
    const response = await fetch(path, options);
    let body;
    try { body = await response.json(); } catch { body = {}; }
    if (!response.ok) throw new Error(body.error || `Request failed (${response.status})`);
    return body;
  }

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  let tools = [];
  let current = null;
  let savedLocations = [];
  let lastMarkdown = '';
  let lastArgs = {};
  let showRaw = false;

  // ---------------------------------------------------------------------
  // Sidebar
  // ---------------------------------------------------------------------
  function renderToolList(filter = '') {
    const list = $('#tool-list');
    list.replaceChildren();
    const needle = filter.trim().toLowerCase();
    const byName = new Map(tools.map((t) => [t.name, t]));
    const placed = new Set();
    const groups = GROUPS.map(([label, names]) => {
      const members = names.filter((n) => byName.has(n)).map((n) => byName.get(n));
      members.forEach((t) => placed.add(t.name));
      return [label, members];
    });
    const others = tools.filter((t) => !placed.has(t.name));
    if (others.length) groups.push(['Other', others]);

    for (const [label, members] of groups) {
      const visible = members.filter((t) => !needle ||
        t.name.includes(needle) || titleFor(t).toLowerCase().includes(needle));
      if (!visible.length) continue;
      list.append(el('div', { class: 'group-label', text: label }));
      for (const tool of visible) {
        list.append(el('button', {
          class: 'tool-btn', type: 'button',
          'aria-current': current && current.name === tool.name ? 'true' : 'false',
          onclick: () => selectTool(tool.name),
        }, titleFor(tool), el('span', { class: 'tool-id', text: tool.name })));
      }
    }
    if (!list.children.length) list.append(el('div', { class: 'hint', text: 'No tools match.' }));
  }

  // ---------------------------------------------------------------------
  // Tool form
  // ---------------------------------------------------------------------
  function splitDescription(text) {
    const match = (text || '').match(/^(.+?[.!?])(\s|$)/s);
    if (!match || match[1].length >= text.length - 2) return [text || '', ''];
    return [match[1], text.slice(match[1].length).trim()];
  }

  function fieldKind(key, schema) {
    const type = Array.isArray(schema.type) ? schema.type[0] : schema.type;
    if (type === 'array') return schema.items && Array.isArray(schema.items.enum) ? 'multi' : 'list';
    if (type === 'boolean') return 'boolean';
    if (type === 'number' || type === 'integer') return 'number';
    if (type === 'string' && Array.isArray(schema.enum)) return 'enum';
    if (type === 'string' && (schema.format === 'date' || /(^|_)date$/.test(key))) return 'date';
    if (type === 'string') return 'text';
    return 'json';
  }

  function buildField(key, schema, required, saved) {
    const kind = fieldKind(key, schema);
    const id = `f-${key}`;
    const hasDefault = schema.default !== undefined;
    // Required fields that have a default start filled in, so "Run" works as-is
    const savedValue = saved && saved[key] !== undefined ? saved[key]
      : (required && hasDefault ? schema.default : undefined);
    let control;

    switch (kind) {
      case 'number':
        control = el('input', {
          id, name: key, type: 'number', step: 'any',
          min: schema.minimum, max: schema.maximum,
          placeholder: hasDefault ? `Default: ${schema.default}` : '',
        });
        if (savedValue !== undefined) control.value = savedValue;
        break;
      case 'enum':
        control = el('select', { id, name: key },
          el('option', { value: '', text: hasDefault ? `Default (${schema.default})` : '—' }),
          schema.enum.map((v) => el('option', { value: v, text: v })));
        if (savedValue !== undefined) control.value = savedValue;
        break;
      case 'date':
        control = el('input', { id, name: key, type: 'date' });
        if (savedValue !== undefined) control.value = savedValue;
        break;
      case 'boolean': {
        const box = el('input', { id, name: key, type: 'checkbox' });
        box.checked = savedValue !== undefined ? savedValue === true : schema.default === true;
        control = el('label', { class: 'switch' }, box, el('span', { text: hasDefault ? `Default: ${schema.default ? 'on' : 'off'}` : 'Enable' }));
        break;
      }
      case 'multi':
        control = el('div', { class: 'chips', id, role: 'group' },
          schema.items.enum.map((v) => {
            const box = el('input', { type: 'checkbox', name: key, value: v });
            box.checked = Array.isArray(savedValue) && savedValue.includes(v);
            return el('label', { class: 'chip' }, box, v);
          }));
        break;
      case 'list':
        control = el('input', { id, name: key, type: 'text', placeholder: 'Comma-separated values' });
        if (Array.isArray(savedValue)) control.value = savedValue.join(', ');
        break;
      case 'json':
        control = el('textarea', { id, name: key, placeholder: 'JSON value' });
        if (savedValue !== undefined) control.value = JSON.stringify(savedValue, null, 2);
        break;
      default: {
        control = el('input', { id, name: key, type: 'text', autocomplete: 'off' });
        if (key === 'alias' || key === 'location_name') control.setAttribute('list', 'saved-aliases');
        if (savedValue !== undefined) control.value = savedValue;
      }
    }

    const wide = kind === 'multi' || kind === 'json' || (schema.description || '').length > 140;
    return el('div', { class: `field${wide ? ' wide' : ''}`, 'data-key': key, 'data-kind': kind },
      el('label', { class: 'name', for: kind === 'multi' ? null : id }, humanize(key), required ? el('span', { class: 'req', text: '*', title: 'Required' }) : null),
      control,
      schema.description ? el('div', { class: 'help', text: schema.description }) : null);
  }

  function readForm(form) {
    const props = current.inputSchema.properties || {};
    const args = {};
    for (const field of form.querySelectorAll('.field')) {
      const key = field.dataset.key;
      const schema = props[key] || {};
      switch (field.dataset.kind) {
        case 'number': {
          const raw = field.querySelector('input').value.trim();
          if (raw !== '') args[key] = Number(raw);
          break;
        }
        case 'boolean': {
          const checked = field.querySelector('input').checked;
          if (checked !== (schema.default === true)) args[key] = checked;
          break;
        }
        case 'multi': {
          const values = [...field.querySelectorAll('input:checked')].map((i) => i.value);
          if (values.length) args[key] = values;
          break;
        }
        case 'list': {
          const values = field.querySelector('input').value.split(',').map((s) => s.trim()).filter(Boolean);
          if (values.length) args[key] = values;
          break;
        }
        case 'json': {
          const raw = field.querySelector('textarea').value.trim();
          if (raw) {
            try { args[key] = JSON.parse(raw); }
            catch { throw new Error(`"${humanize(key)}" must be valid JSON`); }
          }
          break;
        }
        default: {
          const raw = field.querySelector('input, select').value.trim();
          if (raw !== '') args[key] = raw;
        }
      }
    }
    for (const key of current.inputSchema.required || []) {
      if (args[key] === undefined) throw new Error(`"${humanize(key)}" is required`);
    }
    return args;
  }

  function setFieldValue(key, value) {
    const input = document.querySelector(`#tool-card .field[data-key="${key}"] input`);
    if (input) input.value = value;
  }

  function buildLocationHelper(props) {
    const supportsName = 'location_name' in props;
    const savedSelect = el('select', { 'aria-label': 'Saved location' },
      el('option', { value: '', text: savedLocations.length ? 'Choose…' : 'None saved yet' }),
      savedLocations.map((loc) => el('option', { value: loc.alias, text: `${loc.alias} — ${loc.name}` })));
    savedSelect.disabled = !savedLocations.length;
    savedSelect.addEventListener('change', () => {
      const loc = savedLocations.find((l) => l.alias === savedSelect.value);
      if (!loc) return;
      if (supportsName) {
        setFieldValue('location_name', loc.alias);
        setFieldValue('latitude', '');
        setFieldValue('longitude', '');
      } else {
        setFieldValue('latitude', loc.latitude);
        setFieldValue('longitude', loc.longitude);
      }
    });

    const query = el('input', { type: 'text', placeholder: 'City, town, or place', 'aria-label': 'Search for a place' });
    const results = el('div', { class: 'results', hidden: true });
    const searchBtn = el('button', { class: 'btn', type: 'button', text: 'Search' });
    const doSearch = async () => {
      const q = query.value.trim();
      if (q.length < 2) return;
      searchBtn.disabled = true;
      results.hidden = false;
      results.replaceChildren(el('div', { class: 'empty', text: 'Searching…' }));
      try {
        const { results: found } = await api(`/api/geocode?q=${encodeURIComponent(q)}`);
        results.replaceChildren();
        if (!found.length) results.append(el('div', { class: 'empty', text: 'No matches found.' }));
        for (const r of found) {
          const where = [r.admin1, r.country].filter(Boolean).join(', ');
          results.append(el('button', {
            type: 'button',
            onclick: () => {
              setFieldValue('latitude', r.latitude.toFixed(4));
              setFieldValue('longitude', r.longitude.toFixed(4));
              if (supportsName) setFieldValue('location_name', '');
              savedSelect.value = '';
              query.value = r.name + (where ? `, ${where}` : '');
              results.hidden = true;
            },
          }, r.name, el('small', { text: `${where}${where ? ' · ' : ''}${r.latitude.toFixed(3)}, ${r.longitude.toFixed(3)}` })));
        }
      } catch (error) {
        results.replaceChildren(el('div', { class: 'empty', text: error.message }));
      } finally {
        searchBtn.disabled = false;
      }
    };
    searchBtn.addEventListener('click', doSearch);
    query.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
      if (e.key === 'Escape') results.hidden = true;
    });
    document.addEventListener('click', (e) => {
      if (!results.contains(e.target) && e.target !== searchBtn) results.hidden = true;
    });

    const geoBtn = el('button', { class: 'btn', type: 'button', text: 'Use my location' });
    geoBtn.hidden = !('geolocation' in navigator);
    geoBtn.addEventListener('click', () => {
      geoBtn.disabled = true;
      navigator.geolocation.getCurrentPosition((pos) => {
        setFieldValue('latitude', pos.coords.latitude.toFixed(4));
        setFieldValue('longitude', pos.coords.longitude.toFixed(4));
        if (supportsName) setFieldValue('location_name', '');
        savedSelect.value = '';
        geoBtn.disabled = false;
      }, (err) => {
        geoBtn.disabled = false;
        alert(`Couldn't get your location: ${err.message}`);
      }, { timeout: 10000 });
    });

    return el('div', { class: 'loc' },
      el('div', {}, el('label', { text: 'Saved location' }), savedSelect),
      el('div', {}, el('label', { text: 'Find a place' }), el('div', { class: 'search-row' }, query, searchBtn, results)),
      el('div', {}, geoBtn));
  }

  function selectTool(name) {
    const switching = !current || current.name !== name;
    current = tools.find((t) => t.name === name);
    if (!current) return;
    if (switching) {
      // A previous tool's output under a different form is confusing
      $('#result-card').hidden = true;
      window.scrollTo({ top: 0 });
    }
    store.set('weather-console:last-tool', name);
    try { history.replaceState(null, '', `#${name}`); } catch { /* ignore */ }
    renderToolList($('#tool-filter').value);

    const props = (current.inputSchema && current.inputSchema.properties) || {};
    const required = new Set((current.inputSchema && current.inputSchema.required) || []);
    const saved = store.get(`weather-console:args:${name}`);
    const [lead, rest] = splitDescription(current.description);

    const runBtn = el('button', { class: 'btn primary', type: 'submit' }, el('span', { text: 'Run' }));
    const form = el('form', { class: 'fields', novalidate: true },
      Object.entries(props).map(([key, schema]) => buildField(key, schema, required.has(key), saved)),
      el('div', { class: 'actions' },
        runBtn,
        el('button', {
          class: 'btn', type: 'button', text: 'Clear',
          onclick: () => { store.set(`weather-console:args:${name}`, null); selectTool(name); },
        }),
        SLOW_TOOLS.has(name) ? el('span', { class: 'hint', text: 'Model-run data downloads can take up to a minute.' }) : null,
        !Object.keys(props).length ? el('span', { class: 'hint', text: 'This tool takes no parameters.' }) : null));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      let args;
      try {
        args = readForm(form);
      } catch (error) {
        showError(titleFor(current), error.message);
        return;
      }
      store.set(`weather-console:args:${name}`, args);
      runBtn.disabled = true;
      runBtn.replaceChildren(el('span', { class: 'spinner' }), el('span', { text: 'Running…' }));
      try {
        await runTool(current, args);
      } finally {
        runBtn.disabled = false;
        runBtn.replaceChildren(el('span', { text: 'Run' }));
      }
    });

    const card = $('#tool-card');
    card.replaceChildren(
      el('div', { class: 'tool-head' }, el('h2', { text: titleFor(current) }), el('code', { text: current.name })),
      el('div', { class: 'tool-desc' },
        lead,
        rest ? el('details', {}, el('summary', { text: 'More' }), el('p', { text: rest })) : null),
      'latitude' in props && 'longitude' in props ? buildLocationHelper(props) : null,
      form);
  }

  // ---------------------------------------------------------------------
  // Running tools and showing results
  // ---------------------------------------------------------------------
  async function runTool(tool, args) {
    const card = $('#result-card');
    card.hidden = false;
    $('#result-title').textContent = titleFor(tool);
    $('#result-badge').textContent = 'Running';
    $('#result-badge').className = 'badge';
    $('#result-meta').textContent = '';
    $('#result-body').replaceChildren(el('div', { class: 'placeholder' }, 'Waiting for the MCP server…'));

    try {
      const result = await api('/api/call', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: tool.name, arguments: args }),
      });
      const text = (result.content || [])
        .map((part) => part.type === 'text' ? part.text : `*(${part.type} content not shown)*`)
        .join('\n\n');
      lastMarkdown = text;
      lastArgs = args;
      $('#result-badge').textContent = result.isError ? 'Error' : 'OK';
      $('#result-badge').className = result.isError ? 'badge err' : 'badge';
      $('#result-meta').textContent = `${(result.elapsedMs / 1000).toFixed(1)}s`;
      renderResult();
      if (LOCATION_STORE_TOOLS.has(tool.name) && !result.isError) await refreshSavedLocations();
    } catch (error) {
      showError(titleFor(tool), error.message);
    }
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showError(title, message) {
    $('#result-card').hidden = false;
    $('#result-title').textContent = title;
    $('#result-badge').textContent = 'Error';
    $('#result-badge').className = 'badge err';
    $('#result-meta').textContent = '';
    lastMarkdown = message;
    $('#result-body').replaceChildren(el('div', { class: 'error-box', text: message }));
  }

  function renderResult() {
    const body = $('#result-body');
    $('#toggle-raw').textContent = showRaw ? 'Show formatted' : 'Show markdown';
    if (showRaw) {
      body.replaceChildren(el('pre', { class: 'raw', text: lastMarkdown }));
    } else {
      const div = el('div', { class: 'md' });
      div.innerHTML = renderMarkdown(lastMarkdown);
      enhanceRadarImages(div, lastArgs);
      body.replaceChildren(div);
    }
  }

  $('#toggle-raw').addEventListener('click', () => { showRaw = !showRaw; renderResult(); });
  $('#copy-result').addEventListener('click', async () => {
    const btn = $('#copy-result');
    try {
      await navigator.clipboard.writeText(lastMarkdown);
      btn.textContent = 'Copied';
    } catch {
      btn.textContent = 'Copy failed';
    }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  });

  // ---------------------------------------------------------------------
  // Radar map: RainViewer tiles are bare precipitation overlays with no
  // geography, so draw them over a basemap with a pin at the location
  // ---------------------------------------------------------------------
  const RAINVIEWER_TILE = /^(https:\/\/tilecache\.rainviewer\.com\/v2\/radar\/[^/]+)\/\d+\/(\d+)\/\d+\/\d+\/(.+)$/;
  const TILE_PX = 256;
  const MIN_ZOOM = 3;
  const MAX_ZOOM = 7; // RainViewer's free tiles return "Zoom Level Not Supported" above 7
  const MAX_LAT = 85.05112878;

  function worldPixel(lat, lon, zoom) {
    const scale = TILE_PX * 2 ** zoom;
    const clamped = Math.max(-MAX_LAT, Math.min(MAX_LAT, lat)) * Math.PI / 180;
    return {
      x: (lon + 180) / 360 * scale,
      y: (1 - Math.log(Math.tan(clamped) + 1 / Math.cos(clamped)) / Math.PI) / 2 * scale,
    };
  }

  function tileImg(src, left, top, cls) {
    const img = el('img', { src, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer', class: cls, draggable: 'false' });
    img.style.left = `${left}px`;
    img.style.top = `${top}px`;
    img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
    return img;
  }

  function buildRadarMap({ radarBase, radarSuffix, zoom, lat, lon, label }) {
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    // Esri's gray canvas basemaps are built for overlays and need no API key.
    // Base (land, water, borders) goes under the radar; highways and labels go
    // on top so they stay readable through heavy precipitation.
    const canvas = `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${dark ? 'Dark' : 'Light'}_Gray`;
    const tiles = el('div', { class: 'tiles' });
    const pin = el('div', { class: 'pin', title: `${lat.toFixed(4)}, ${lon.toFixed(4)}` });
    const zoomIn = el('button', { type: 'button', 'aria-label': 'Zoom in', text: '+' });
    const zoomOut = el('button', { type: 'button', 'aria-label': 'Zoom out', text: '−' });
    const map = el('div', { class: 'radar-map', role: 'img', 'aria-label': `Radar map centered on ${lat.toFixed(3)}, ${lon.toFixed(3)}` },
      tiles, pin,
      el('div', { class: 'zoom' }, zoomIn, zoomOut),
      label ? el('div', { class: 'map-label', text: label }) : null,
      el('div', { class: 'attribution' },
        'Basemap © ', el('a', { href: 'https://www.esri.com', target: '_blank', rel: 'noopener noreferrer', text: 'Esri' }),
        ', HERE, Garmin, © ', el('a', { href: 'https://www.openstreetmap.org/copyright', target: '_blank', rel: 'noopener noreferrer', text: 'OpenStreetMap' }),
        ' · Radar ', el('a', { href: 'https://www.rainviewer.com', target: '_blank', rel: 'noopener noreferrer', text: 'RainViewer' })));

    let z = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));
    let center = worldPixel(lat, lon, z);

    function draw() {
      const width = map.clientWidth || 640;
      const height = map.clientHeight || 400;
      const left = center.x - width / 2;
      const top = center.y - height / 2;
      const count = 2 ** z;
      const nodes = [];
      for (let ty = Math.floor(top / TILE_PX); ty <= Math.floor((top + height) / TILE_PX); ty++) {
        if (ty < 0 || ty >= count) continue;
        for (let tx = Math.floor(left / TILE_PX); tx <= Math.floor((left + width) / TILE_PX); tx++) {
          const wx = ((tx % count) + count) % count; // wrap around the antimeridian
          const px = tx * TILE_PX - left;
          const py = ty * TILE_PX - top;
          nodes.push(
            tileImg(`${canvas}_Base/MapServer/tile/${z}/${ty}/${wx}`, px, py, 'base'),
            tileImg(`${radarBase}/512/${z}/${wx}/${ty}/${radarSuffix}`, px, py, 'radar'),
            tileImg(`https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/${z}/${ty}/${wx}`, px, py, 'roads'),
            tileImg(`${canvas}_Reference/MapServer/tile/${z}/${ty}/${wx}`, px, py, 'labels'));
        }
      }
      tiles.replaceChildren(...nodes);
      const here = worldPixel(lat, lon, z);
      pin.style.left = `${here.x - left}px`;
      pin.style.top = `${here.y - top}px`;
      zoomIn.disabled = z >= MAX_ZOOM;
      zoomOut.disabled = z <= MIN_ZOOM;
    }

    function setZoom(next) {
      if (next < MIN_ZOOM || next > MAX_ZOOM) return;
      const factor = 2 ** (next - z);
      center = { x: center.x * factor, y: center.y * factor };
      z = next;
      draw();
    }
    zoomIn.addEventListener('click', () => setZoom(z + 1));
    zoomOut.addEventListener('click', () => setZoom(z - 1));

    // Drag to pan
    let drag = null;
    map.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, a')) return;
      drag = { x: e.clientX, y: e.clientY, center: { ...center } };
      map.setPointerCapture(e.pointerId);
      map.classList.add('dragging');
    });
    map.addEventListener('pointermove', (e) => {
      if (!drag) return;
      center = { x: drag.center.x - (e.clientX - drag.x), y: drag.center.y - (e.clientY - drag.y) };
      draw();
    });
    const endDrag = () => { drag = null; map.classList.remove('dragging'); };
    map.addEventListener('pointerup', endDrag);
    map.addEventListener('pointercancel', endDrag);
    map.addEventListener('dblclick', () => { center = worldPixel(lat, lon, z); draw(); });

    if ('ResizeObserver' in window) new ResizeObserver(() => draw()).observe(map);
    requestAnimationFrame(draw);
    return map;
  }

  function enhanceRadarImages(container, args) {
    for (const img of container.querySelectorAll('img')) {
      const match = img.getAttribute('src').match(RAINVIEWER_TILE);
      if (!match) continue;
      const [, radarBase, zoom, radarSuffix] = match;
      let lat = Number(args.latitude);
      let lon = Number(args.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        // Fall back to the coordinates printed in the tool output
        const printed = lastMarkdown.match(/\*\*Location:\*\*\s*(-?[\d.]+),\s*(-?[\d.]+)/);
        if (!printed) continue;
        lat = Number(printed[1]);
        lon = Number(printed[2]);
      }
      img.replaceWith(buildRadarMap({ radarBase, radarSuffix, zoom: Number(zoom), lat, lon, label: img.alt }));
    }
  }

  // ---------------------------------------------------------------------
  // Minimal, escape-first markdown renderer (tool output is markdown)
  // ---------------------------------------------------------------------
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function safeUrl(url) {
    const decoded = url.replace(/&amp;/g, '&');
    return /^https?:\/\//i.test(decoded) ? url : null;
  }

  function inline(text) {
    // Protect inline code first so its contents are not formatted
    const codes = [];
    let s = escapeHtml(text).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => {
      const safe = safeUrl(url);
      return safe ? `<img src="${safe}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer">` : m;
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
      const safe = safeUrl(url);
      return safe ? `<a href="${safe}" target="_blank" rel="noopener noreferrer">${label}</a>` : m;
    });
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, pre, url) =>
      `${pre}<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[Number(i)]}</code>`);
    return s;
  }

  function renderMarkdown(md) {
    const lines = md.replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let para = [];
    let list = null; // { type: 'ul' | 'ol', items: [] }

    const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; } };
    const flushList = () => {
      if (list) { out.push(`<${list.type}>${list.items.map((i) => `<li>${inline(i)}</li>`).join('')}</${list.type}>`); list = null; }
    };
    const flush = () => { flushPara(); flushList(); };
    const cells = (row) => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const trimmed = line.trim();

      if (trimmed.startsWith('```')) {
        flush();
        const code = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith('```')) { code.push(lines[i]); i++; }
        out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
        continue;
      }
      if (!trimmed) { flush(); continue; }

      const heading = trimmed.match(/^(#{1,6})\s+(.*)$/);
      if (heading) { flush(); out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`); continue; }

      if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) { flush(); out.push('<hr>'); continue; }

      if (trimmed.startsWith('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        flush();
        const head = cells(trimmed);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(cells(lines[i])); i++; }
        i--;
        out.push('<div class="table-wrap"><table><thead><tr>' + head.map((c) => `<th>${inline(c)}</th>`).join('') +
          '</tr></thead><tbody>' + rows.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
          '</tbody></table></div>');
        continue;
      }

      const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
      const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (bullet || numbered) {
        flushPara();
        const type = bullet ? 'ul' : 'ol';
        if (!list || list.type !== type) { flushList(); list = { type, items: [] }; }
        list.items.push((bullet || numbered)[1]);
        continue;
      }

      if (trimmed.startsWith('>')) { flush(); out.push(`<blockquote>${inline(trimmed.replace(/^>\s?/, ''))}</blockquote>`); continue; }

      flushList();
      para.push(trimmed);
    }
    flush();
    return out.join('\n');
  }

  // ---------------------------------------------------------------------
  // Saved locations (for the picker and alias autocomplete)
  // ---------------------------------------------------------------------
  async function refreshSavedLocations() {
    try {
      ({ locations: savedLocations } = await api('/api/saved-locations'));
    } catch {
      savedLocations = [];
    }
    let datalist = $('#saved-aliases');
    if (!datalist) { datalist = el('datalist', { id: 'saved-aliases' }); document.body.append(datalist); }
    datalist.replaceChildren(...savedLocations.map((l) => el('option', { value: l.alias, label: l.name })));
    if (current) {
      // Rebuild just the helper so its dropdown reflects the change, keeping form input intact
      const helper = $('#tool-card .loc');
      const props = current.inputSchema.properties || {};
      if (helper) helper.replaceWith(buildLocationHelper(props));
    }
  }

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  function setStatus(kind, text) {
    $('#status').className = `status ${kind}`;
    $('#status-text').textContent = text;
  }

  $('#tool-filter').addEventListener('input', (e) => renderToolList(e.target.value));

  async function boot() {
    try {
      ({ tools } = await api('/api/tools'));
      setStatus('ok', `Connected · ${tools.length} tools`);
    } catch (error) {
      setStatus('err', 'Not connected');
      $('#tool-card').replaceChildren(el('div', { class: 'error-box', text:
        `Couldn't load tools from the MCP server: ${error.message}\n\nMake sure the console is running (npm run web) and check its terminal output.` }));
      return;
    }
    await refreshSavedLocations();
    const fromHash = decodeURIComponent(location.hash.slice(1));
    const last = store.get('weather-console:last-tool');
    const initial = [fromHash, last, 'get_forecast'].find((n) => n && tools.some((t) => t.name === n)) || (tools[0] && tools[0].name);
    renderToolList();
    if (initial) selectTool(initial);
  }

  boot();
})();
</script>
</body>
</html>
