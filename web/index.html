    // Place the tooltip beside the crosshair, flipping near the right edge
    const scale = chart.clientWidth / g.W;
    const px = x * scale;
    const tw = tip.offsetWidth;
    tip.style.left = `${px + 14 + tw > chart.clientWidth ? Math.max(0, px - 14 - tw) : px + 14}px`;
    // Sit just below the pointer's level line, or above it when there's no room below.
    // Without a pointer (keyboard), sit below the day's high.
    const anchor = (cx.pointerY ?? (d.high[i] !== null ? g.y(d.high[i]) : g.mt)) * scale;
    const th = tip.offsetHeight;
    const below = anchor + 16;
    const top = below + th <= chart.clientHeight ? below : anchor - 16 - th;
    tip.style.top = `${Math.max(0, Math.min(top, chart.clientHeight - th))}px`;
  }

  // Horizontal guide at the pointer's height, labeled on the temperature axis
  function showLevel(svg, svgY) {
    const g = svg._geom;
    const group = svg.querySelector('#cx-level');
    if (svgY === null || svgY < g.mt || svgY > g.mt + g.mainH) { group.innerHTML = ''; return; }
    const value = g.lo + (1 - (svgY - g.mt) / g.mainH) * (g.hi - g.lo);
    const yy = svgY.toFixed(1);
    group.innerHTML = `<line class="level" x1="${g.ml}" x2="${g.W - g.mr}" y1="${yy}" y2="${yy}"/>` +
      `<g class="level-tag"><rect x="1" y="${(svgY - 9).toFixed(1)}" width="${g.ml - 4}" height="18" rx="4"/>` +
      `<text x="${g.ml - 7}" y="${yy}" dy="0.34em" text-anchor="end">${Math.round(value)}°${cx.unit}</text></g>`;
  }

  function wireChart(chart, svg, tip) {
    const toSvg = (e) => {
      const g = svg._geom;
      const rect = svg.getBoundingClientRect();
      const k = g.W / rect.width;
      return { x: (e.clientX - rect.left) * k, y: (e.clientY - rect.top) * k };
    };
    const indexAt = (clientX) => {
      const g = svg._geom;
      const rect = svg.getBoundingClientRect();
      const x = (clientX - rect.left) * (g.W / rect.width);
      const i = g.a + Math.floor((x - g.ml) / g.dayW);
      return Math.max(g.a, Math.min(g.b - 1, i));
    };
    let brush = null;
    chart.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !e.target.classList.contains('hit') || toSvg(e).x < svg._geom.ml) return;
      brush = { start: indexAt(e.clientX), x: e.clientX, moved: false };
      chart.setPointerCapture(e.pointerId);
    });
    chart.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'mouse' && !e.target.closest('svg') && !brush) return;
      const pos = toSvg(e);
      showLevel(svg, brush ? null : pos.y);
      cx.pointerY = pos.y;
      if (pos.x < svg._geom.ml && !brush) { showHover(chart, svg, tip, null); return; }
      const i = indexAt(e.clientX);
      if (brush && Math.abs(e.clientX - brush.x) > 5) {
        brush.moved = true;
        const g = svg._geom;
        const [lo, hi] = [Math.min(brush.start, i), Math.max(brush.start, i)];
        const r = svg.querySelector('#cx-brush');
        r.setAttribute('x', g.xl(lo).toFixed(1));
        r.setAttribute('width', (g.xl(hi + 1) - g.xl(lo)).toFixed(1));
        r.setAttribute('visibility', 'visible');
      }
      showHover(chart, svg, tip, i);
    });
    const endBrush = (e) => {
      if (!brush) return;
      const done = brush;
      brush = null;
      if (!done.moved) return;
      const i = indexAt(e.clientX);
      const lo = Math.min(done.start, i), hi = Math.max(done.start, i) + 1;
      if (hi - lo >= 3) {
        cx.range = [lo, hi];
        updateClimate();
      } else {
        svg.querySelector('#cx-brush').setAttribute('visibility', 'hidden');
      }
    };
    chart.addEventListener('pointerup', endBrush);
    chart.addEventListener('pointercancel', () => { brush = null; });
    chart.addEventListener('pointerleave', () => {
      if (brush) return;
      cx.hover = null;
      showHover(chart, svg, tip, null);
      showLevel(svg, null);
      cx.pointerY = null;
    });
    chart.addEventListener('dblclick', () => {
      if (!cx.range && cx.mode.month === null) return;
      cx.range = null;
      cx.mode.month = null;
      updateClimate();
    });
    chart.addEventListener('keydown', (e) => {
      const g = svg._geom;
      cx.pointerY = null;
      const moves = { ArrowLeft: -1, ArrowRight: 1, PageUp: -7, PageDown: 7 };
      if (e.key in moves) {
        e.preventDefault();
        const from = cx.hover === null || cx.hover < g.a || cx.hover >= g.b ? (moves[e.key] > 0 ? g.a - 1 : g.b) : cx.hover;
        showHover(chart, svg, tip, Math.max(g.a, Math.min(g.b - 1, from + moves[e.key])));
      } else if (e.key === 'Home' || e.key === 'End') {
        e.preventDefault();
        showHover(chart, svg, tip, e.key === 'Home' ? g.a : g.b - 1);
      } else if (e.key === 'Escape') {
        cx.hover = null;
        showHover(chart, svg, tip, null);
      }
    });
    chart.addEventListener('blur', () => { cx.hover = null; showHover(chart, svg, tip, null); });
  }

  // ----- summary for the visible range -----
  function renderStats([a, b], rangeLabel) {
    const box = $('#cx-stats');
    const d = cx.data, clim = d.climatology;
    let n = 0, sumHi = 0, sumLo = 0, hot = 0, cold = 0, recHi = 0, recLo = 0;
    let warm = null, coldest = null, precip = 0, precipNormal = 0, wetDays = 0;
    for (let i = a; i < b; i++) {
      const s = cx.slot[i];
      const h = d.high[i], l = d.low[i];
      const year = Number(cx.iso[i].slice(0, 4));
      if (h !== null && l !== null && clim.high.mean[s] !== null && clim.low.mean[s] !== null) {
        n++;
        sumHi += h - clim.high.mean[s];
        sumLo += l - clim.low.mean[s];
        const qh = clim.high.quantiles[s], ql = clim.low.quantiles[s];
        if (qh && h > qh[Q90]) hot++;
        if (ql && l < ql[Q10]) cold++;
        if (clim.recordHigh[s] && clim.recordHigh[s].year === year) recHi++;
        if (clim.recordLow[s] && clim.recordLow[s].year === year) recLo++;
        if (warm === null || h > d.high[warm]) warm = i;
        if (coldest === null || l < d.low[coldest]) coldest = i;
      }
      if (d.precipitation[i] !== null) {
        precip += d.precipitation[i];
        if (d.precipitation[i] >= 0.01) wetDays++;
        if (clim.precipitationMean[s] !== null) precipNormal += clim.precipitationMean[s];
      }
    }
    if (!n) { box.replaceChildren(el('div', { class: 'hint', text: 'No data in this range.' })); return; }
    const stat = (k, v, sub, cls) => el('div', { class: 'cx-stat' }, el('div', { class: 'k', text: k }), el('div', { class: `v ${cls || ''}`, text: v }), sub ? el('div', { class: 's', text: sub }) : null);
    const pct = precipNormal > 0 ? Math.round((precip / precipNormal) * 100) : null;
    box.replaceChildren(
      stat('Highs vs normal', fmtDelta(sumHi / n), `${rangeLabel}, ${n} days`, sumHi >= 0 ? 'hi' : 'lo'),
      stat('Lows vs normal', fmtDelta(sumLo / n), `avg departure from ${clim.baseline.startYear}–${clim.baseline.endYear}`, sumLo >= 0 ? 'hi' : 'lo'),
      stat('Warmest', fmtT(d.high[warm]), fmtDate(cx.iso[warm]), 'hi'),
      stat('Coldest', fmtT(d.low[coldest]), fmtDate(cx.iso[coldest]), 'lo'),
      stat('Unusually hot days', String(hot), 'high above 90th pct', 'hi'),
      stat('Unusually cold nights', String(cold), 'low below 10th pct', 'lo'),
      stat('Records set', `${recHi} / ${recLo}`, 'high / low, still standing'),
      stat('Precipitation', fmtP(precip), `${pct === null ? '' : `${pct}% of normal (${fmtP(precipNormal)}) · `}${wetDays} wet days`));
  }

  // ---------------------------------------------------------------------
  // Saved locations (for the picker and alias autocomplete)
  // ---------------------------------------------------------------------
  async function refreshSavedLocations() {
    try {
      ({ locations: savedLocations } = await api('/api/saved-locations'));
    } catch {
      savedLocations = [];
    }
    let datalist = $('#saved-aliases');
    if (!datalist) { datalist = el('datalist', { id: 'saved-aliases' }); document.body.append(datalist); }
    datalist.replaceChildren(...savedLocations.map((l) => el('option', { value: l.alias, label: l.name })));
    if (current) {
      // Rebuild just the helper so its dropdown reflects the change, keeping form input intact
      const helper = $('#tool-card .loc');
      const props = current.inputSchema.properties || {};
      if (helper) helper.replaceWith(buildLocationHelper(props));
    }
  }

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  function setStatus(kind, text) {
    $('#status').className = `status ${kind}`;
    $('#status-text').textContent = text;
  }

  $('#tool-filter').addEventListener('input', (e) => renderToolList(e.target.value));

  async function boot() {
    try {
      ({ tools } = await api('/api/tools'));
      setStatus('ok', `Connected · ${tools.length} tools`);
    } catch (error) {
      if (error instanceof AccessTokenRequired) return; // the sign-in dialog is showing
      setStatus('err', 'Not connected');
      $('#tool-card').replaceChildren(el('div', { class: 'error-box', text:
        `Couldn't load tools from the MCP server: ${error.message}\n\nMake sure the console is running (npm run web) and check its terminal output.` }));
      return;
    }
    await refreshSavedLocations();
    const fromHash = decodeURIComponent(location.hash.slice(1));
    const last = store.get('weather-console:last-tool');
    if (fromHash === 'climate' || (!fromHash && last === 'climate')) {
      renderToolList();
      showClimateExplorer();
      return;
    }
    const initial = [fromHash, last, 'get_forecast'].find((n) => n && tools.some((t) => t.name === n)) || (tools[0] && tools[0].name);
    renderToolList();
    if (initial) selectTool(initial);
  }

  boot();
})();
</script>
</body>
</html>
